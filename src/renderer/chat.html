<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>和鲸鱼娘聊天</title>
  <link rel="stylesheet" href="chat.css" />
</head>
<body>
  <div id="header">
    <span id="headerHint">她记得你的人设和长期记忆，但只看得见当前这段对话</span>
    <button id="balanceQuery" type="button">余额</button>
    <button id="newConversation" type="button">新对话</button>
  </div>
  <div id="messages"></div>
  <form id="composer">
    <textarea id="input" placeholder="跟鲸鱼娘说点什么…（Enter 发送，Shift+Enter 换行）" rows="2"></textarea>
    <button id="stop" type="button" hidden>停止</button>
    <button id="send" type="submit">发送</button>
  </form>
  <script src="chat.js"></script>
</body>
</html>
