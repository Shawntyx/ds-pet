<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>设置</title>
  <link rel="stylesheet" href="theme.css" />
  <link rel="stylesheet" href="settings.css" />
</head>
<body>
  <div id="pageVersion" class="dash-label"><span id="appVersion"></span></div>
  <form id="form">
    <section>
      <h2>模型</h2>
      <label>
        API Key
        <input id="apiKey" type="password" autocomplete="off" placeholder="" />
      </label>
      <div class="field-note">
        <span id="apiKeyStatusLabel" class="status-label"></span>
        <span class="info-tip" id="apiKeyHint" tabindex="0">i</span>
      </div>
      <p class="hint" id="userDataHint"></p>
      <button type="button" id="openDataDir">打开数据目录</button>
      <label>
        Base URL
        <input id="baseURL" type="text" />
      </label>
      <label>
        模型名
        <input id="model" type="text" />
      </label>
    </section>

    <section>
      <h2>人设</h2>
      <label>
        当前人设
        <select id="persona"></select>
      </label>
      <div class="row">
        <button type="button" id="openPersonaFile">打开人设文件</button>
        <span class="info-tip" data-tip="改完文件直接保存，不用重启、不用点这里的重新加载。" tabindex="0">i</span>
      </div>
    </section>

    <section>
      <h2>
        长期记忆
        <span class="info-tip" id="memoryHint" data-tip="还没有记忆" tabindex="0">i</span>
      </h2>
      <label class="checkbox">
        <input id="memoryEnabled" type="checkbox" /> 启用长期记忆
        <span class="info-tip" data-tip="从聊天里记住关于你的事" tabindex="0">i</span>
      </label>
      <label>
        每多少轮提取一次
        <input id="memoryExtractEveryRounds" type="number" min="1" step="1" />
      </label>
      <label>
        每次聊天最多注入多少条
        <input id="memoryInjectCount" type="number" min="0" step="1" />
      </label>
      <ul id="memoryList" class="memory-list"></ul>
      <div class="row">
        <button type="button" id="openMemoryFile">打开记忆文件</button>
        <button type="button" id="clearMemory">清空全部记忆</button>
        <span
          class="info-tip"
          data-tip="提取时会明确要求模型不记录密码、API Key、身份证号等信息，落盘前还会再过一遍正则过滤。记忆只存在本机（userData/memory/facts.json），点每条右边的 ✕ 可以单独删掉。"
          tabindex="0"
          >i</span
        >
      </div>
    </section>

    <section>
      <h2>
        聊天记录
        <span class="info-tip" id="chatHistoryHint" data-tip="还没有聊天记录" tabindex="0">i</span>
      </h2>
      <label>
        发给模型的最近轮数
        <input id="chatHistoryRounds" type="number" min="1" step="1" />
      </label>
      <div class="row">
        <button type="button" id="clearChatHistory">清空聊天记录</button>
        <span
          class="info-tip"
          data-tip="记录只存在本机（userData/chat/history.json），重启也能接着聊；清空后不可恢复，人设文件不受影响。"
          tabindex="0"
          >i</span
        >
      </div>
    </section>

    <section>
      <h2>快捷键与待机</h2>
      <label>
        隐藏/召唤
        <input id="toggleShortcut" type="text" placeholder="例如 Ctrl+Alt+W" />
      </label>
      <label>
        无操作多少分钟后趴下（分钟）
        <span
          class="info-tip"
          data-tip="这段时间没有键盘鼠标操作她就趴着（23:00–6:00 换成坐着睡的姿势），你一动手她就醒过来打招呼。"
          tabindex="0"
          >i</span
        >
        <input id="afkAfterMinutes" type="number" min="1" step="1" />
      </label>
    </section>

    <section>
      <h2>账户余额</h2>
      <p class="hint" id="balanceText">还没查询过</p>
      <div class="row">
        <button type="button" id="refreshBalance">立即查询</button>
        <span
          class="info-tip"
          data-tip="只有 DeepSeek 官方接口（/user/balance）能查，换成别的兼容服务会显示“不支持”。启动查一次，之后每 6 小时一次；余额从够用变成不足时她会冒个气泡提醒一下。"
          tabindex="0"
          >i</span
        >
      </div>
      <label>
        低于多少时提醒（0 = 不提醒）
        <input id="balanceWarnThreshold" type="number" min="0" step="1" />
      </label>
    </section>

    <section>
      <h2>
        主动说话
        <span
          class="info-tip"
          data-tip="勿扰模式开启时完全不说话，跟这里的开关无关；勿扰在桌宠右键菜单或托盘菜单里切换。你离开电脑（超过上面那个分钟数）时她也不会自言自语。"
          tabindex="0"
          >i</span
        >
      </h2>
      <label class="checkbox"><input id="proactiveEnabled" type="checkbox" /> 启用主动说话</label>
      <label class="checkbox"><input id="healthReminder" type="checkbox" /> 久坐/喝水/深夜提醒</label>
      <label class="checkbox">
        <input id="windowTitleRoast" type="checkbox" /> 窗口标题吐槽
        <span
          class="info-tip"
          data-tip="只读取当前活动窗口的程序名和标题（不截图、不读窗口内容），会发送给模型服务商用来生成吐槽。"
          tabindex="0"
          >i</span
        >
      </label>
      <label>
        标题过滤词
        <span class="info-tip" data-tip="逗号或换行分隔，命中就跳过这次吐槽" tabindex="0">i</span>
        <textarea id="titleFilterWords" rows="2" placeholder="银行、密码、无痕等常见词已经内置了，这里填你想额外排除的"></textarea>
      </label>
      <label class="checkbox"><input id="randomQuestion" type="checkbox" /> 随机哲学问题</label>
      <label>
        平均间隔（分钟）
        <input id="avgIntervalMinutes" type="number" min="1" step="1" />
      </label>
    </section>

    <div id="status"></div>
    <button id="save" type="submit">保存</button>
  </form>
  <script src="settings.js"></script>
</body>
</html>
