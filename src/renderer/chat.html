<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>和鲸鱼娘聊天</title>
  <link rel="stylesheet" href="theme.css" />
  <link rel="stylesheet" href="chat.css" />
</head>
<body>
  <div id="header">
    <div id="headerTitle">
      <svg id="headerTail" viewBox="0 0 24 22" aria-hidden="true">
        <path d="M12 21C12 21 3.5 17 2 11C4.5 11.5 8 12.5 10.3 10.2C8.7 7.5 8.7 4 12 1
          C15.3 4 15.3 7.5 13.7 10.2C16 12.5 19.5 11.5 22 11C20.5 17 12 21 12 21Z" fill="currentColor"/>
      </svg>
      <p id="headerName">
        鲸鱼娘
        <span
          class="info-tip"
          data-tip="她记得你的人设和长期记忆，但只看得见当前这段对话"
          tabindex="0"
          >i</span
        >
      </p>
    </div>
    <button id="newConversation" type="button">新对话</button>
  </div>
  <div id="messages"></div>
  <form id="composer">
    <textarea id="input" placeholder="跟鲸鱼娘说点什么…（Enter 发送，Shift+Enter 换行）" rows="2"></textarea>
    <button id="stop" type="button" hidden>停止</button>
    <button id="send" type="submit">发送</button>
  </form>
  <script src="chat.js"></script>
</body>
</html>
